<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="24" fill="url(#bgGrad)" />

  <!-- Abstract glowing tech accents -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="350" r="180" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />
  <path d="M 0,240 Q 300,100 600,240 T 1200,240" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.2" />

  <!-- Center Logo Container -->
  <g transform="translate(180, 70)">
    <!-- White Card for SDH Logo -->
    <rect x="0" y="0" width="280" height="280" rx="28" fill="#ffffff" filter="url(#glow)" />
    
    <!-- SDH Geometric Logo Inside -->
    <g transform="translate(25, 45) scale(0.23)">
      <!-- SDH Logo Paths -->
      <path d="M 50,150 L 350,150 L 350,230 L 170,230 L 170,300 L 350,300 L 350,450 L 50,450 L 50,370 L 230,370 L 230,300 L 50,300 Z" fill="#000000" />
      <path d="M 400,150 L 700,150 L 700,450 L 400,450 Z M 480,230 L 480,370 L 620,370 L 620,230 Z" fill="#000000" />
      <path d="M 750,150 L 830,150 L 830,260 L 970,260 L 970,150 L 1050,150 L 1050,450 L 970,450 L 970,340 L 830,340 L 830,450 L 750,450 Z" fill="#000000" />
      <text x="550" y="520" font-family="'Inter', sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#000000" letter-spacing="14">SMART DIGITAL HUB</text>
    </g>
  </g>

  <!-- Right Side Content -->
  <g transform="translate(520, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1.5" />
    <text x="110" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#c4b5fd" text-anchor="middle">✨ 100% GENUINE &amp; TRUSTED</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">SMART DIGITAL HUB</text>
    
    <!-- Tagline -->
    <text x="0" y="130" font-family="'Inter', sans-serif" font-weight="600" font-size="22" fill="#94a3b8">
      সকল ধরণের ডিজিটাল সাবস্ক্রিপশন ও প্রিমিয়াম টুলস
    </text>

    <!-- Features -->
    <g transform="translate(0, 175)">
      <circle cx="10" cy="-6" r="6" fill="#10b981" />
      <text x="26" y="0" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#e2e8f0">⚡ ২-৫ মিনিটে ইনস্ট্যান্ট ডেলিভারি</text>
      
      <circle cx="280" cy="-6" r="6" fill="#10b981" />
      <text x="296" y="0" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#e2e8f0">🛡️ ২৪/৭ ফুল সাপোর্ট</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="240" height="48" rx="24" fill="url(#glowGrad)" />
      <text x="120" y="30" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">অর্ডার করুন এখনই →</text>
    </g>
  </g>
</svg>
